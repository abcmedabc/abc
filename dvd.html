<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<title>DVD Screensaver</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
  const cv = document.getElementById('c'), ctx = cv.getContext('2d');
  function resize() { cv.width = innerWidth; cv.height = innerHeight; }
  addEventListener('resize', resize); resize();

  const LW = 160, LH = 80, SPEED = 160;
  const logo = { x: 100, y: 100, vx: SPEED, vy: SPEED, hue: 0, alive: true, respawn: 0 };
  const ship = { w: 50, h: 24, x: innerWidth / 2, speed: 520, cooldown: 0 };
  const bullets = [], particles = [];
  const keys = {};
  let score = 0;

  function recolor() { logo.hue = (logo.hue + 50 + Math.random() * 100) % 360; }
  function spawnLogo() {
    logo.x = Math.random() * (cv.width - LW);
    logo.y = Math.random() * (cv.height * 0.4);
    logo.vx = (Math.random() < 0.5 ? -1 : 1) * SPEED;
    logo.vy = SPEED;
    recolor();
    logo.alive = true;
  }

  function explode(cx, cy, hue) {
    for (let i = 0; i < 140; i++) {
      const a = Math.random() * Math.PI * 2, s = 40 + Math.random() * 380;
      particles.push({
        x: cx + (Math.random() - 0.5) * LW * 0.8, y: cy + (Math.random() - 0.5) * LH * 0.6,
        vx: Math.cos(a) * s, vy: Math.sin(a) * s,
        life: 0.6 + Math.random() * 0.9, max: 1.5,
        hue: Math.random() < 0.6 ? hue : 30 + Math.random() * 30,
        r: 2 + Math.random() * 4
      });
    }
  }

  addEventListener('keydown', e => {
    keys[e.code] = true;
    if (e.code === 'Space' || e.code.startsWith('Arrow')) e.preventDefault();
  });
  addEventListener('keyup', e => keys[e.code] = false);
  addEventListener('click', () => {
    if (!document.fullscreenElement) document.documentElement.requestFullscreen?.();
    else document.exitFullscreen?.();
  });

  function drawLogo() {
    ctx.save();
    ctx.translate(logo.x, logo.y);
    ctx.fillStyle = `hsl(${logo.hue} 100% 55%)`;
    ctx.font = 'italic 900 46px "Arial Black", Impact, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('DVD', LW / 2, 46);
    ctx.beginPath(); ctx.ellipse(LW / 2, 64, 70, 10, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#000'; ctx.font = 'bold 11px Arial';
    ctx.fillText('VIDEO', LW / 2, 68);
    ctx.restore();
  }

  function drawShip() {
    const y = cv.height - 20 - ship.h;
    ctx.fillStyle = '#4f4';
    ctx.fillRect(ship.x - ship.w / 2, y + 10, ship.w, ship.h - 10);
    ctx.fillRect(ship.x - ship.w / 5, y + 4, ship.w * 0.4, 8);
    ctx.fillRect(ship.x - 3, y - 4, 6, 10);
  }

  let last = performance.now();
  function frame(now) {
    const dt = Math.min((now - last) / 1000, 0.05); last = now;
    ctx.fillStyle = '#000'; ctx.fillRect(0, 0, cv.width, cv.height);

    // ship
    const dir = (keys.ArrowRight || keys.KeyD ? 1 : 0) - (keys.ArrowLeft || keys.KeyA ? 1 : 0);
    ship.x = Math.max(ship.w / 2, Math.min(cv.width - ship.w / 2, ship.x + dir * ship.speed * dt));
    ship.cooldown -= dt;
    if (keys.Space && ship.cooldown <= 0) {
      bullets.push({ x: ship.x, y: cv.height - 20 - ship.h - 4 });
      ship.cooldown = 0.25;
    }

    // logo
    if (logo.alive) {
      logo.x += logo.vx * dt; logo.y += logo.vy * dt;
      const mx = cv.width - LW, my = cv.height - LH;
      if (logo.x <= 0)  { logo.x = 0;  logo.vx =  Math.abs(logo.vx); recolor(); }
      if (logo.x >= mx) { logo.x = mx; logo.vx = -Math.abs(logo.vx); recolor(); }
      if (logo.y <= 0)  { logo.y = 0;  logo.vy =  Math.abs(logo.vy); recolor(); }
      if (logo.y >= my) { logo.y = my; logo.vy = -Math.abs(logo.vy); recolor(); }
      drawLogo();
    } else if ((logo.respawn -= dt) <= 0) spawnLogo();

    // bullets
    ctx.fillStyle = '#fff';
    for (let i = bullets.length - 1; i >= 0; i--) {
      const b = bullets[i];
      b.y -= 700 * dt;
      if (logo.alive && b.x > logo.x && b.x < logo.x + LW && b.y > logo.y && b.y < logo.y + LH) {
        explode(logo.x + LW / 2, logo.y + LH / 2, logo.hue);
        logo.alive = false; logo.respawn = 2; score++;
        bullets.splice(i, 1); continue;
      }
      if (b.y < -10) { bullets.splice(i, 1); continue; }
      ctx.fillRect(b.x - 2, b.y, 4, 14);
    }

    // particles
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.life -= dt;
      if (p.life <= 0) { particles.splice(i, 1); continue; }
      p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.98; p.vy = p.vy * 0.98 + 120 * dt;
      ctx.globalAlpha = Math.min(1, p.life / 0.5);
      ctx.fillStyle = `hsl(${p.hue} 100% 60%)`;
      ctx.fillRect(p.x, p.y, p.r, p.r);
    }
    ctx.globalAlpha = 1;

    drawShip();
    ctx.font = 'bold 16px sans-serif'; ctx.textAlign = 'left';
    ctx.fillStyle = '#ffeb3b';
    const scoreText = `Skóre: ${score}`;
    ctx.fillText(scoreText, 14, 26);
    ctx.fillStyle = '#fff';
    ctx.fillText(`   ←/→ nebo A/D = pohyb, mezerník = střelba, klik = celá obrazovka`, 14 + ctx.measureText(scoreText).width, 26);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
</script>
</body>
</html>
